<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exaustech · Serviços da semana</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{ --navy:#0d2338; --navy2:#102c47; --azul:#3E7EB0; --azul-l:#7fb3dc; --branco:#f4f7fa; --cinza:#9fb3c4; --linha:#1d3a55; --ok:#5fd48a; --alerta:#f5c518; --erro:#ff6b5f; --noite:#9fc6ff; --dia:#f0d98c; }
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{background:var(--navy); color:var(--branco); font-family:Inter,"Segoe UI",Arial,sans-serif; overflow:hidden}
.tela{height:100vh; display:grid; grid-template-rows:auto 1fr auto}

.topo{display:flex; align-items:center; gap:26px; padding:16px 34px; background:linear-gradient(90deg,#0a1c2e,#0d2338 60%,#102c47); border-bottom:3px solid var(--azul)}
.logo{display:flex; align-items:center; gap:12px}
.logo .cubo{width:44px; height:44px; border-radius:9px; background:var(--azul); display:grid; place-items:center; font-weight:800; font-size:26.4px; color:#fff}
.logo b{font-size:24px; letter-spacing:.3em; font-weight:800}
.logo small{display:block; color:var(--cinza); letter-spacing:.14em; font-size:12px; font-weight:500; margin-top:2px}
.titulo h1{font-size:36px; font-weight:800; letter-spacing:.02em}
.titulo h1 span{color:var(--azul-l)}
.titulo .periodo{color:var(--cinza); font-size:18px; margin-top:3px}
.resumo{margin-left:auto; display:flex; gap:12px}
.card{background:var(--navy2); border:1px solid var(--linha); border-radius:12px; padding:10px 16px; min-width:118px; text-align:center}
.card .n{font-family:"JetBrains Mono",monospace; font-size:36px; font-weight:800; line-height:1}
.card .r{font-size:13.2px; color:var(--cinza); letter-spacing:.14em; margin-top:4px}
.card.alerta .n{color:var(--alerta)}
.relogio{text-align:right; padding-left:20px; border-left:1px solid var(--linha)}
.relogio .h{font-family:"JetBrains Mono",monospace; font-size:57.6px; font-weight:800; line-height:1; color:#fff}
.relogio .d{color:var(--cinza); font-size:16.8px; margin-top:4px; text-transform:capitalize}

.corpo{display:grid; grid-template-columns:1fr 310px; gap:0; overflow:hidden}
.tabela{padding:0 0 0 34px; overflow:hidden}
.cab{display:grid; grid-template-columns:135px 1fr 196px 108px 158px 215px 206px; gap:12px; padding:12px 12px; font-size:14.4px; letter-spacing:.2em; color:var(--cinza); border-bottom:1px solid var(--linha); font-weight:700}
.dia{display:flex; align-items:center; gap:14px; padding:12px 12px 6px; margin-top:6px}
.dia b{font-size:22.8px; font-weight:800; letter-spacing:.04em; color:var(--dia)}
.dia b span{color:var(--azul-l); font-family:"JetBrains Mono",monospace; margin-right:8px}
.dia .hoje{font-size:13.2px; letter-spacing:.16em; background:var(--azul); color:#fff; padding:3px 9px; border-radius:999px; font-weight:800}
.dia .tr{flex:1; height:1px; background:var(--linha)}
.linha{display:grid; grid-template-columns:135px 1fr 196px 108px 158px 215px 206px; gap:12px; align-items:center; padding:9px 12px; border-radius:10px; min-height:80px}
.linha:nth-child(even){background:rgba(255,255,255,.025)}
.hora{font-family:"JetBrains Mono",monospace; font-size:36px; font-weight:800; line-height:1}
.hora small{display:block; font-size:14.4px; color:var(--cinza); letter-spacing:.1em; margin-top:4px; font-weight:600}
.cliente{font-size:25px; font-weight:800; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cliente small{display:block; overflow:hidden; text-overflow:ellipsis; font-size:15.6px; color:var(--cinza); letter-spacing:.12em; font-weight:600; margin-top:3px}
.tipo{display:inline-flex; align-items:center; gap:8px; font-size:16.8px; font-weight:800; letter-spacing:.14em; padding:7px 12px; border-radius:8px; border:1px solid var(--linha); background:var(--navy2)}
.tipo i{width:10px; height:10px; border-radius:50%; display:inline-block}
.tipo.MPP i{background:var(--azul-l)} .tipo.EMERGENCIAL i{background:var(--erro)} .tipo.RETORNO i{background:var(--alerta)} .tipo.CORRETIVA i{background:#ffa94d}
.ot{font-family:"JetBrains Mono",monospace; font-size:20.4px; font-weight:700; color:#fff}
.equipe{display:flex; flex-wrap:wrap; gap:6px}
.equipe span{font-size:20.4px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--navy2); border:1px solid var(--linha)}
.equipe span.lid{background:var(--azul); border-color:var(--azul); color:#fff}
.equipe span.lid::before{content:"★ "; font-size:13.2px}
.equipe .vazio{color:var(--cinza); font-style:italic; border-style:dashed}
.status{font-size:18px; font-weight:800; letter-spacing:.12em; text-align:center; padding:11px 10px; border-radius:10px; border:1px solid var(--linha); background:var(--navy2)}
.status.ok{color:var(--ok)} .status.and{color:var(--ok); background:#12341f; border-color:#1f5a33}
.status.alerta{color:var(--alerta); border-color:#5f4e10; animation:pisca 1.8s infinite}
.status.erro{color:var(--erro); border-color:#6a2b25; animation:pisca 1.8s infinite}
.status.noite{color:var(--noite)}
@keyframes pisca{0%,100%{opacity:1} 50%{opacity:.5}}

.lado{border-left:1px solid var(--linha); padding:18px 24px; display:flex; flex-direction:column; gap:16px; background:#0b1e31}
.lado h2{font-size:14.4px; letter-spacing:.22em; color:var(--cinza); font-weight:800}
.agora{background:var(--navy2); border:1px solid var(--linha); border-radius:14px; padding:16px}
.agora .q{font-size:15.6px; color:var(--cinza); letter-spacing:.1em; margin-bottom:8px}
.agora .c{font-size:26.4px; font-weight:800; line-height:1.15}
.agora .e{color:var(--azul-l); font-size:18px; margin-top:8px; font-weight:700}
.agora.vazia .c{color:var(--cinza); font-weight:600; font-size:20.4px}
.semana{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.semana div{background:var(--navy2); border:1px solid var(--linha); border-radius:10px; padding:8px 4px; text-align:center}
.semana div b{display:block; font-family:"JetBrains Mono",monospace; font-size:26.4px; font-weight:800}
.semana div small{font-size:12px; letter-spacing:.14em; color:var(--cinza); font-weight:700}
.semana div.hoje{border-color:var(--azul); background:#143a5c}
.semana div.feriado{border-color:#6a2b25} .semana div.feriado b{color:var(--erro)}
.avisos{flex:1; display:flex; flex-direction:column; gap:8px}
.avisos p{background:var(--navy2); border-left:4px solid var(--azul); border-radius:8px; padding:10px 12px; font-size:18px; line-height:1.3}
.legenda{display:flex; flex-wrap:wrap; gap:10px; font-size:13.2px; letter-spacing:.1em; color:var(--cinza); font-weight:700}
.legenda i{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px}

.rodape{display:flex; align-items:center; gap:18px; padding:10px 34px; background:#0a1c2e; border-top:1px solid var(--linha); color:var(--cinza); font-size:15.6px; letter-spacing:.08em}
.rodape .pag{margin-left:auto; font-family:"JetBrains Mono",monospace}
.rodape .pt{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:8px; animation:pisca 2s infinite}
.sep{font-family:"JetBrains Mono",monospace; font-weight:700; font-size:15px; letter-spacing:.1em; text-align:center; padding:8px 8px; border-radius:6px; border:1px solid var(--linha); background:var(--navy2)}
.sep.ok{color:var(--ok, var(--verde))} .sep.and{color:var(--azul-l, var(--azul))} .sep.alerta{color:var(--alerta, var(--amarelo))} .sep.neutro{color:var(--cinza); border-style:dashed}
.topo .logoimg{height:62px; width:auto; display:block}

/* Opcao 1: a linha inteira pisca em vermelho, com barra lateral solida */
.linha.emerg{background:rgba(255,80,70,.22); border-left:8px solid var(--erro); animation:emergFundo 1.2s ease-in-out infinite; border-radius:10px}
@keyframes emergFundo{0%,100%{background:rgba(255,80,70,.22)} 50%{background:rgba(255,80,70,.55)}}
.linha.emerg .status{color:#fff; background:var(--erro); border-color:var(--erro); animation:none}
.linha.emerg .tipo{background:var(--erro); border-color:var(--erro); color:#fff} .linha.emerg .tipo i{background:#fff}

/* Opcao D1: faixa cheia em azul do logo, de ponta a ponta, texto branco e data em dourado */
.dia{background:linear-gradient(90deg, var(--azul), #1c4f7d 60%, transparent); border-radius:8px; padding:9px 16px; margin-top:12px; gap:16px}
.dia b{color:#fff; font-size:23px; letter-spacing:.06em; text-transform:uppercase}
.dia b span{color:var(--dia); font-family:"JetBrains Mono",monospace; margin-right:12px}
.dia .hoje{background:#fff; color:var(--navy)}
.dia .tr{display:none}
.rodape .pt.off{background:var(--erro); animation:pisca 1s infinite}
#login{position:fixed; inset:0; background:var(--navy); display:none; place-items:center; z-index:9}
#login .cx{background:var(--navy2); border:1px solid var(--linha); border-radius:16px; padding:36px 40px; text-align:center; min-width:380px}
#login h2{font-size:22px; font-weight:800; margin:16px 0 6px}
#login p{color:var(--cinza); font-size:14px; margin-bottom:18px}
#login .msg{color:var(--erro); font-size:14px; min-height:18px; margin-top:12px}
</style>
</head>

  const el = document.getElementById('lista');
  const alvo = (document.querySelector('.tabela') || el);
  const cabEl = document.querySelector('.cab'); const disponivel = alvo.clientHeight - (alvo === el ? 0 : cabEl.offsetHeight + 4);
  el.innerHTML = linhas.map(htmlDe).join('');
  const alturas = Array.from(el.children).map(c => { const cs = getComputedStyle(c); return c.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom); });
  const paginasArr = []; let atual = [], usado = 0;
  linhas.forEach((l, k) => {
    const h = alturas[k], prox = (l.tipo === 'dia' && k + 1 < linhas.length) ? alturas[k + 1] : 0;
    if (atual.length && usado + h + prox > disponivel) { paginasArr.push(atual); atual = []; usado = 0; }
    atual.push(l); usado += h;
  });
  if (atual.length) paginasArr.push(atual);
  const paginas = paginasArr.length;
  pagina = pagina % paginas;
  const fatia = paginasArr[pagina];
  el.innerHTML = fatia.map(htmlDe).join('');
  el.querySelectorAll('.cliente').forEach(c => { let fs = parseFloat(getComputedStyle(c).fontSize); while (c.scrollWidth > c.clientWidth && fs > 18){ fs -= 1; c.style.fontSize = fs + 'px'; } });
  document.getElementById('pag').textContent = 'PÁGINA ' + (pagina + 1) + ' / ' + paginas;
}
function htmlDe(l){
  {
    if (l.tipo === 'dia'){
      const d = dataDoDia(l.i);
      return '<div class="dia"><b><span>' + dd(d) + '</span>' + DIA_NOME[l.i] + '</b>' + (l.i === idxHoje ? '<span class="hoje">HOJE</span>' : '') + '<div class="tr"></div></div>';
    }
    const s = Object.assign({}, l.s, { cliente: corta(l.s.cliente, LIMITES.cliente), local: corta(l.s.local, LIMITES.local), lider: l.s.lider ? corta(l.s.lider, LIMITES.lider) : null });
    const equipe = s.lider ? '<span class="lid">' + esc(s.lider) + '</span>' : '<span class="vazio">a definir</span>';
    const emerg = (s.emergencia || (s.tipo === 'EMERGENCIAL' && s.sep && s.sep !== 'SEM MATERIAL' && s.sep !== 'EMBARCADA' && s.sep !== 'RECEBIDA')) ? ' emerg' : '';
    return '<div class="linha' + emerg + '">'
      + '<div class="hora">' + esc(s.ini) + '</div>'
      + '<div class="cliente">' + esc(s.cliente) + '<small>' + esc(s.local) + '</small></div>'
      + '<div><span class="tipo ' + esc(s.tipo) + '"><i></i>' + esc(s.tipo) + '</span></div>'
      + '<div class="ot">' + esc(s.ot) + '</div>'
      + '<div class="sep ' + classeSep(s.sep) + '">' + esc(s.sep || 'SEM MATERIAL') + '</div>'
      + '<div class="equipe">' + equipe + '</div>'
      + '<div class="status ' + (CLASSE_STATUS[s.status] || 'ok') + '">' + esc(s.status) + '</div>'
      + '</div>';
  }
}
function lateral(){
  const total = SERVICOS.length, mpp = SERVICOS.filter(s => s.tipo === 'MPP').length,
        urg = SERVICOS.filter(s => s.tipo === 'EMERGENCIAL').length,
        pend = SERVICOS.filter(s => !s.lider).length;
  document.getElementById('resumo').innerHTML =
    '<div class="card"><div class="n">' + total + '</div><div class="r">SERVIÇOS</div></div>'
    + '<div class="card"><div class="n">' + mpp + '</div><div class="r">MPP</div></div>'
    + '<div class="card"><div class="n">' + urg + '</div><div class="r">EMERGÊNCIAS</div></div>'
    + '<div class="card' + (pend ? ' alerta' : '') + '"><div class="n">' + pend + '</div><div class="r">SEM LÍDER</div></div>';
  /* proximo: primeiro servico de hoje em diante (no mockup, se hoje nao esta na semana, pega o primeiro) */
  const agoraMin = hoje.getHours() * 60 + hoje.getMinutes();
  let prox = SERVICOS.find(s => s.d > idxHoje || (s.d === idxHoje && (+s.ini.slice(0,2) * 60 + +s.ini.slice(3)) >= agoraMin)) || SERVICOS[0];
  const el = document.getElementById('proximo');
  if (!prox){ el.className = 'agora vazia'; el.innerHTML = '<div class="c">Nenhum serviço programado</div>'; }
  else el.innerHTML = '<div class="q">' + DIAS[prox.d] + ' ' + dd(dataDoDia(prox.d)) + ' · ' + esc(prox.ini) + '</div><div class="c">' + esc(prox.cliente) + '</div><div class="e">' + esc(prox.tipo) + (prox.lider ? ' · ★ ' + esc(prox.lider) : ' · equipe a definir') + '</div>';
  document.getElementById('semana').innerHTML = DIAS.map((n, i) => {
    const d = dataDoDia(i), q = SERVICOS.filter(s => s.d === i).length;
    return '<div class="' + (i === idxHoje ? 'hoje' : '') + '"><small>' + n + '</small><b>' + q + '</b><small>' + dd(d).slice(0,2) + '</small></div>';
  }).join('');
  document.getElementById('avisos').innerHTML = AVISOS.map(a => '<p>' + esc(a) + '</p>').join('');
}
function relogio(){
  const n = new Date();
  document.getElementById('relogio').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  document.getElementById('hoje').textContent = n.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}
/* ===== sessao e carga (04/10/2026) =====
   Login Google igual ao do app de campo; o backend devolve um token de sessao (30 dias para o papel
   Monitor). O token fica no navegador do monitor; sem token a pagina mostra so a tela de entrada. */
const TOKEN_KEY = 'painelTok';
function tok(){ try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } }
function guardaTok(t){ try { localStorage.setItem(TOKEN_KEY, t); } catch(e){} }
function sair(){ try { localStorage.removeItem(TOKEN_KEY); } catch(e){} location.reload(); }
function mostraLogin(msg){
  document.getElementById('login').style.display = 'grid';
  document.getElementById('loginMsg').textContent = msg || '';
  if (window.google && google.accounts){
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', width:280 });
  } else setTimeout(() => mostraLogin(msg), 400);
}
async function onGoogleCredential(resp){
  if (!resp || !resp.credential) return;
  try {
    const r = await fetch(BACKEND + '/login', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ googleIdToken: resp.credential }) });
    const j = await r.json();
    if (!r.ok || !j.token) throw new Error(j.error || 'Falha no login');
    guardaTok(j.token);
    document.getElementById('login').style.display = 'none';
    carregar();
  } catch(e){ mostraLogin(e.message); }
}
function online(ok, texto){
  const r = document.getElementById('estado');
  r.innerHTML = '<span class="pt' + (ok ? '' : ' off') + '"></span>' + (texto || (ok ? 'SISTEMA ON LINE' : 'SISTEMA OFF LINE'));
}
let ultimaBoa = null;
async function carregar(){
  if (!tok()){ mostraLogin(''); return; }
  try {
    const r = await fetch(BACKEND + '/painel/semana', { headers:{ Authorization:'Bearer ' + tok() } });
    if (r.status === 401){ sair(); return; }
    if (r.status === 403){ online(false, 'SEM PERMISSÃO PARA O PAINEL'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    SEMANA = d.semana; DIAS = d.dias || DIAS; SERVICOS = d.servicos || []; AVISOS = d.avisos || [];
    hoje = new Date(); idxHoje = (typeof d.semana.hojeIdx === 'number') ? d.semana.hojeIdx : -1;
    document.getElementById('periodo').textContent = 'Semana de ' + SEMANA.rotulo;
    lateral(); render();
    ultimaBoa = Date.now();
    online(true);
  } catch(e){
    /* mantem a ultima tela boa e avisa no rodape; o monitor nao pode ficar em branco */
    online(false, 'SISTEMA OFF LINE' + (ultimaBoa ? ' · ÚLTIMA ATUALIZAÇÃO ' + new Date(ultimaBoa).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : ''));
  }
}
relogio(); setInterval(relogio, 15000);
setInterval(() => { if (SERVICOS.length || simular) { pagina++; render(); } }, 12000);
setInterval(carregar, 60000);
carregar();
</script>
